<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaaToy — Dashboard Preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
        padding: 32px 16px;
        font-family: "IBM Plex Sans Thai", sans-serif;
      }

      /* ── Phone shell ── */
      .phone {
        width: 393px;
        min-height: 852px;
        background: #f5f6f7;
        border-radius: 40px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
      }

      /* ── Close button ── */
      .btn-close {
        position: absolute;
        top: 13px;
        right: 16px;
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #767b8e;
        font-size: 20px;
        font-weight: 600;
      }

      /* ── Header ── */
      .header {
        text-align: center;
        padding-top: 53px;
      }
      .header h1 {
        font-size: 20px;
        font-weight: 600;
        color: #1a1a1a;
      }
      .balance {
        font-size: 36px;
        font-weight: 700;
        color: #c1ade0;
        margin-top: 8px;
      }

      /* ── Toggle ── */
      .toggle-wrap {
        display: flex;
        justify-content: center;
        margin-top: 16px;
      }
      .toggle-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 15px;
        height: 27px;
        background: #f5f6f7;
        border: 1px solid #c8cddf;
        border-radius: 5px;
        cursor: pointer;
      }
      .toggle-btn span {
        font-size: 14px;
        font-weight: 500;
        color: #767b8e;
      }
      .toggle-btn svg {
        width: 17px;
        height: 17px;
        color: #767b8e;
      }

      /* ── Summary cards ── */
      .summary-cards {
        display: flex;
        gap: 5px;
        margin: 20px 19px 0;
      }
      .card-expense,
      .card-income {
        flex: 1;
        height: 83px;
        border-radius: 5px;
        padding: 12px 14px;
        box-shadow: 4px 4px 4px #c8cddf;
      }
      .card-expense {
        background: #fbe7eb;
      }
      .card-income {
        background: #e9e1f6;
      }

      .card-expense .card-label {
        font-size: 12px;
        color: #d5485b;
      }
      .card-income .card-label {
        font-size: 12px;
        color: #483c76;
      }

      .card-expense .card-amount {
        font-size: 20px;
        font-weight: 700;
        color: #d5485b;
        margin-top: 6px;
      }
      .card-income .card-amount {
        font-size: 20px;
        font-weight: 700;
        color: #483c76;
        margin-top: 6px;
      }

      /* ── Main card ── */
      .main-card {
        margin: 10px 19px 0;
        background: #f5f6f7;
        border-radius: 5px;
        box-shadow: 0px 0px 4px #c8cddf;
        padding: 20px 16px 20px;
      }
      .main-card-title {
        font-size: 16px;
        font-weight: 500;
        color: #1a1a1a;
        text-align: center;
        text-decoration: underline;
        margin-bottom: 16px;
      }

      /* ── Chart + stats row ── */
      .chart-stats-row {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .donut-wrap {
        flex-shrink: 0;
        width: 160px;
        height: 160px;
      }
      .donut-wrap svg {
        width: 100%;
        height: 100%;
      }

      .stats-col {
        flex: 1;
      }
      .stat-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .stat-label {
        font-size: 11px;
        color: #1a1a1a;
      }
      .stat-value {
        font-size: 11px;
        font-weight: 700;
        color: #d5485b;
      }

      /* ── Category list ── */
      .category-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px 0;
        margin-top: 20px;
      }
      .cat-item {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .cat-icon {
        width: 33px;
        height: 33px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
      }
      .cat-icon.pink {
        background: #fbe7eb;
      }
      .cat-icon.purple {
        background: #e9e1f6;
      }
      .cat-icon.blue {
        background: #e1eaf6;
      }
      .cat-icon.orange {
        background: #fdf0e7;
      }
      .cat-icon.green {
        background: #e7f6ec;
      }

      .cat-amount {
        font-size: 11px;
        font-weight: 500;
        color: #1a1a1a;
      }

      /* ── Action button ── */
      .btn-edit-wrap {
        display: flex;
        justify-content: center;
        margin-top: 20px;
      }
      .btn-edit {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 307px;
        height: 35px;
        background: #fbe7eb;
        border: 1px solid #d5485b;
        border-radius: 5px;
        filter: drop-shadow(4px 4px 2px #c8cddf);
        cursor: pointer;
        font-size: 11px;
        font-weight: 500;
        color: #d5485b;
        font-family: "IBM Plex Sans Thai", sans-serif;
      }

      /* ── Bottom Nav ── */
      .bottom-nav {
        position: sticky;
        bottom: 0;
        width: 393px;
        height: 62px;
        background: #f5f6f7;
        box-shadow: 0px -2px 11px #c8cddf;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 24px;
      }
      .nav-icons {
        display: flex;
        align-items: center;
        gap: 45px;
      }
      .nav-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: #767b8e;
      }
      .nav-icon.active {
        color: #d5485b;
      }
      .nav-icon svg {
        width: 28px;
        height: 28px;
      }
    </style>
  </head>
  <body>
    <div class="phone">
      <!-- Close -->
      <div class="btn-close">✕</div>

      <!-- Header -->
      <div class="header">
        <h1>ยอดคงเหลือ</h1>
        <div class="balance">฿ 30,486.00</div>
      </div>

      <!-- Toggle -->
      <div class="toggle-wrap">
        <button class="toggle-btn">
          <span>ยอดสะสม</span>
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M7 16V4m0 0L3 8m4-4l4 4M17 8v12m0 0l4-4m-4 4l-4-4" />
          </svg>
        </button>
      </div>

      <!-- Summary cards -->
      <div class="summary-cards">
        <div class="card-expense">
          <div class="card-label">รายจ่ายสะสม</div>
          <div class="card-amount">฿ 19,514.00</div>
        </div>
        <div class="card-income">
          <div class="card-label">รายรับสะสม</div>
          <div class="card-amount">฿ 50,000.00</div>
        </div>
      </div>

      <!-- Main card -->
      <div class="main-card">
        <div class="main-card-title">สรุปรายจ่ายทั้งหมด</div>

        <!-- Donut + stats -->
        <div class="chart-stats-row">
          <!-- Donut chart (SVG) -->
          <div class="donut-wrap">
            <svg viewBox="0 0 160 160">
              <circle
                cx="80"
                cy="80"
                r="60"
                fill="none"
                stroke="#f0f0f0"
                stroke-width="28"
              />
              <!-- segments (rough from screenshot) -->
              <circle
                cx="80"
                cy="80"
                r="60"
                fill="none"
                stroke="#d5485b"
                stroke-width="28"
                stroke-dasharray="113 263"
                stroke-dashoffset="47"
              />
              <circle
                cx="80"
                cy="80"
                r="60"
                fill="none"
                stroke="#e9a0aa"
                stroke-width="28"
                stroke-dasharray="75 301"
                stroke-dashoffset="-66"
              />
              <circle
                cx="80"
                cy="80"
                r="60"
                fill="none"
                stroke="#c1ade0"
                stroke-width="28"
                stroke-dasharray="55 321"
                stroke-dashoffset="-141"
              />
              <circle
                cx="80"
                cy="80"
                r="60"
                fill="none"
                stroke="#e9e1f6"
                stroke-width="28"
                stroke-dasharray="20 356"
                stroke-dashoffset="-196"
              />
            </svg>
          </div>

          <!-- Stats -->
          <div class="stats-col">
            <div class="stat-row">
              <span class="stat-label">ระยะเวลาทั้งหมด</span>
              <span class="stat-value">47 วัน</span>
            </div>
            <div class="stat-row">
              <span class="stat-label">รายการทั้งหมด</span>
              <span class="stat-value">480 รายการ</span>
            </div>
          </div>
        </div>

        <!-- Category list -->
        <div class="category-grid">
          <div class="cat-item">
            <div class="cat-icon pink">🍽️</div>
            <span class="cat-amount">฿ 6,200.00</span>
          </div>
          <div class="cat-item">
            <div class="cat-icon purple">🛍️</div>
            <span class="cat-amount">฿ 3,040.00</span>
          </div>
          <div class="cat-item">
            <div class="cat-icon blue">📶</div>
            <span class="cat-amount">฿ 4,847.00</span>
          </div>
          <div class="cat-item">
            <div class="cat-icon orange">⋯</div>
            <span class="cat-amount">฿ 1,500.00</span>
          </div>
          <div class="cat-item">
            <div class="cat-icon green">🧳</div>
            <span class="cat-amount">฿ 3,927.00</span>
          </div>
        </div>

        <!-- Edit button -->
        <div class="btn-edit-wrap">
          <button class="btn-edit">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#d5485b"
              stroke-width="2"
            >
              <path
                d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
              />
              <path
                d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
              />
            </svg>
            แก้ไขข้อมูล
          </button>
        </div>
      </div>

      <!-- Bottom Nav -->
      <div class="bottom-nav">
        <div class="nav-icons">
          <!-- Home (active) -->
          <div class="nav-icon active">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
            </svg>
          </div>
          <!-- Bar chart -->
          <div class="nav-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M5 12h2v9H5zm6-7h2v16h-2zm6 4h2v12h-2z" />
            </svg>
          </div>
          <!-- Pie chart -->
          <div class="nav-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M11 2v10l8.9 5.1A10 10 0 0 1 11 2zm2 0a10 10 0 0 1 8.9 14.1L13 12V2z"
              />
            </svg>
          </div>
          <!-- List -->
          <div class="nav-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"
              />
            </svg>
          </div>
          <!-- Money bag -->
          <div class="nav-icon">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 2C9.5 2 8 3.5 8 5c0 .6.2 1.2.5 1.7C6.4 7.7 5 9.7 5 12c0 3.9 3.1 7 7 7s7-3.1 7-7c0-2.3-1.4-4.3-3.5-5.3.3-.5.5-1.1.5-1.7 0-1.5-1.5-3-4-3zm0 2c1.1 0 2 .6 2 1s-.9 1-2 1-2-.6-2-1 .9-1 2-1zm0 3c2.8 0 5 2.2 5 5s-2.2 5-5 5-5-2.2-5-5 2.2-5 5-5zm0 2v1H9v2h3v1l3-2-3-2z"
              />
            </svg>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
